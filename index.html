<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario Darling 💜</title>
    <link rel="icon" type="image/png" href="assets/img/tuyyoGatitos.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Reproductor de Música Flotante */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(245, 238, 248, 0.9); /* var(--light) */
            backdrop-filter: blur(5px);
            border: 2px solid #8e44ad; /* var(--primary) */
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
            opacity: 0.8;
        }
        .music-player:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        .music-icon {
            font-size: 1.5rem;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .music-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .music-title {
            font-weight: 600;
            color: #8e44ad; /* var(--primary) */
            font-size: 0.9rem;
        }
        .music-artist {
            font-size: 0.75rem;
            color: #9b59b6; /* var(--secondary) */
        }
        .play-btn {
            background: #8e44ad;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            outline: none;
        }
        .play-btn:hover {
            transform: scale(1.1);
            background: #732d91;
        }
        
        /* Controles de Volumen */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 8px;
            margin-right: 8px;
        }
        .volume-icon {
            font-size: 0.9rem;
            color: #8e44ad;
        }
        .volume-slider {
            width: 55px;
            accent-color: #8e44ad;
            cursor: pointer;
        }
        
        /* Ajustes para celulares (100% responsive) */
        @media (max-width: 480px) {
            .music-player {
                bottom: 15px;
                right: 15px;
                left: 15px; /* Estira el reproductor a lo ancho en pantallas pequeñas */
                justify-content: space-between; /* Espacia los elementos uniformemente */
                border-radius: 20px;
                padding: 6px 12px;
                gap: 5px;
            }
            .music-info {
                max-width: 100px;
                overflow: hidden;
                white-space: nowrap;
            }
            .music-title {
                font-size: 0.8rem;
                text-overflow: ellipsis;
                overflow: hidden;
            }
            .music-artist {
                font-size: 0.65rem;
            }
            .volume-container {
                margin-left: 0;
                margin-right: 0;
            }
            .volume-slider {
                width: 40px;
            }
            .music-icon {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Reproductor de música global -->
    <audio id="bg-music" loop autoplay>
        <source src="assets/music/Eres_Mi_Tesoro.mp3" type="audio/mpeg">
    </audio>

    <!-- Interfaz del reproductor -->
    <div class="music-player">
        <div class="music-icon">🎵</div>
        <div class="music-info">
            <span class="music-title">Eres Mi Tesoro</span>
            <span class="music-artist">Jesse & Joy</span>
        </div>
        <div class="volume-container">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="20" class="volume-slider" title="Ajustar volumen">
        </div>
        <button class="play-btn" id="play-pause-btn" onclick="togglePlay()">▶️</button>
    </div>

    <iframe src="pages/bienvenida.html" id="main-frame" title="Contenido Principal"></iframe>

    <script>
        const bgMusic = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-pause-btn");
        const volumeSlider = document.getElementById("volume-slider");

        // Volumen por defecto al 20%
        bgMusic.volume = 0.2;

        // Cambiar el volumen en tiempo real cuando se mueva la barrita
        volumeSlider.addEventListener("input", function() {
            bgMusic.volume = this.value / 100;
        });

        function togglePlay() {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log(e));
                playBtn.textContent = "⏸";
            } else {
                bgMusic.pause();
                playBtn.textContent = "▶️";
            }
        }

        // Actualizar botón si la música se pausa o reproduce por otro lado
        bgMusic.addEventListener("play", () => playBtn.textContent = "⏸");
        bgMusic.addEventListener("pause", () => playBtn.textContent = "▶️");

        // Escuchar el mensaje desde el iframe para iniciar la música
        window.addEventListener("message", function(event) {
            if (event.data === "playMusic") {
                if (bgMusic.paused) {
                    bgMusic.play().catch(e => console.log("Esperando interacción del usuario...", e));
                }
            }
        });
    </script>
</body>
</html>
