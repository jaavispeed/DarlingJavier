<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario Darling 💜</title>
    <link rel="icon" type="image/png" href="../assets/img/tuyyoGatitos.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="opacity: 0; animation: fadeInPage 1s forwards;">
    <!-- Corazones de fondo interactivos -->
    <div class="bg-hearts" id="bg-hearts"></div>

    <!-- Pantalla 1: Bienvenida -->
    <div class="screen" id="welcome-screen">
        
        <!-- Baraja de Polaroids (2 izq - principal centro - 2 der) -->
        <div class="polaroid-deck">
            <!-- Izquierda lejana -->
            <div class="polaroid bg-polaroid bg-1">
                <img src="../assets/img/tuyyoGatitos4.png" alt="Gatitos 4">
                <div class="bg-polaroid-msg">Mi hogar eres tú 🏠</div>
            </div>
            <!-- Izquierda cercana -->
            <div class="polaroid bg-polaroid bg-2">
                <img src="../assets/img/tuyyoGatitos3.png" alt="Gatitos 3">
                <div class="bg-polaroid-msg">Te amo infinito 💜</div>
            </div>

            <!-- Imagen CENTRAL estilo Polaroid (la principal) -->
            <div class="polaroid welcome-polaroid main-polaroid">
                <img src="../assets/img/tuyyoGatitos.png" alt="Tú y yo">
                <div class="polaroid-text">
                    <div class="p-title">Para mi hermosa Darling 💜</div>
                    <div class="p-subtitle">Felices 3 años juntos...</div>
                    <div class="p-date">✨ 30-08-2023 ✨</div>
                </div>
            </div>

            <!-- Derecha cercana -->
            <div class="polaroid bg-polaroid bg-3">
                <img src="../assets/img/tuyyoGatitos2.png" alt="Gatitos 2">
                <div class="bg-polaroid-msg">Mi persona favorita ✨</div>
            </div>
            <!-- Derecha lejana -->
            <div class="polaroid bg-polaroid bg-4">
                <img src="../assets/img/tuyyoGatitos5.png" alt="Gatitos 5">
                <div class="bg-polaroid-msg">Juntos por siempre 💌</div>
            </div>
        </div>

        <!-- Contador amoroso centrado -->
        <div class="romantic-counter-container">
            <div class="fc-days romantic-days" id="days-counter"></div>
        </div>
        
        <button class="start-btn" id="start-btn" onclick="showPasswordPrompt()">Comenzar nuestro viaje</button>
        
        <div class="password-container hidden" id="password-container">
            <p>Ingresa nuestra fecha especial para entrar:</p>
            <input type="text" id="date-password" placeholder="DD-MM-YYYY" class="password-input">
            <button class="unlock-btn" onclick="checkPassword()">Desbloquear 💜</button>
            <p class="error-msg hidden" id="error-msg">Fecha incorrecta, mi amor. Intenta de nuevo.</p>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
    <style>
        @keyframes fadeInPage {
            to { opacity: 1; }
        }
    </style>
</body>
</html>
