<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario Darling 💜</title>
    <link rel="icon" type="image/png" href="../assets/img/tuyyoGatitos.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="welcome-body" style="opacity: 0; animation: fadeInPage 1s forwards;">
    <!-- Estrellas de fondo interactivas -->
    <div class="bg-stars" id="bg-stars"></div>

    <!-- Pantalla 1: Bienvenida -->
    <div class="screen" id="welcome-screen">
        
        <!-- Decoración Constelaciones (Hechas con la fuente Dancing Script y estrellas) -->
        <div class="constellations-container">
            <svg class="constellation-svg" viewBox="0 0 200 150">
                <!-- Líneas tenues conectando las estrellas -->
                <text x="20" y="100" font-family="'Dancing Script', cursive" font-size="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">F</text>
                <text x="120" y="100" font-family="'Dancing Script', cursive" font-size="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">J</text>
                
                <!-- Puntos brillantes (estrellas) formando exactamente la letra -->
                <text x="20" y="100" font-family="'Dancing Script', cursive" font-size="90" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="0, 15" stroke-linecap="round" class="const-star-text">F</text>
                <text x="120" y="100" font-family="'Dancing Script', cursive" font-size="90" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="0, 15" stroke-linecap="round" class="const-star-text">J</text>
                
                <!-- Estrella brillante en medio -->
                <text x="85" y="70" font-family="sans-serif" font-size="25" fill="rgba(255,255,255,0.9)" class="const-star-text">✨</text>
            </svg>
        </div>

        <!-- Baraja de Polaroids (2 izq - principal centro - 2 der) -->
        <div class="polaroid-deck">
            <!-- Izquierda lejana -->
            <div class="polaroid bg-polaroid bg-1">
                <img src="../assets/img/tuyyoGatitos4.png" alt="Gatitos 4">
                <div class="bg-polaroid-msg">Mi hogar eres tú 🏠</div>
            </div>
            <!-- Izquierda cercana -->
            <div class="polaroid bg-polaroid bg-2">
                <img src="../assets/img/tuyyoGatitos3.png" alt="Gatitos 3">
                <div class="bg-polaroid-msg">Te amo infinito 💜</div>
            </div>

            <!-- Imagen CENTRAL estilo Polaroid (la principal) -->
            <div class="polaroid welcome-polaroid main-polaroid">
                <img src="../assets/img/tuyyoGatitos.png" alt="Tú y yo">
                <div class="polaroid-text">
                    <div class="p-title">Para mi hermosa Darling 💜</div>
                    <div class="p-subtitle">Felices 3 años juntos...</div>
                    <div class="p-date">✨ 30-08-2023 ✨</div>
                </div>
            </div>

            <!-- Derecha cercana -->
            <div class="polaroid bg-polaroid bg-3">
                <img src="../assets/img/tuyyoGatitos2.png" alt="Gatitos 2">
                <div class="bg-polaroid-msg">Mi persona favorita ✨</div>
            </div>
            <!-- Derecha lejana -->
            <div class="polaroid bg-polaroid bg-4">
                <img src="../assets/img/tuyyoGatitos5.png" alt="Gatitos 5">
                <div class="bg-polaroid-msg">Juntos por siempre 💌</div>
            </div>
        </div>

        <!-- Contador como notita escrita a mano -->
        <div class="handwritten-note">
            <span id="days-counter"></span>
        </div>
        
        <button class="btn-primary btn-lg" id="start-btn" onclick="showPasswordPrompt()">Comenzar nuestro viaje</button>
        
        <div class="password-container hidden" id="password-container">
            <p>Ingresa nuestra contraseña:</p>
            <input type="text" id="date-password" placeholder="DD-MM-YYYY" class="password-input">
            <button class="btn-primary btn-sm" onclick="checkPassword()">Desbloquear 💜</button>
            <p class="error-msg hidden" id="error-msg">Fecha incorrecta, mi amor. Intenta de nuevo.</p>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
    <style>
        @keyframes fadeInPage {
            to { opacity: 1; }
        }
    </style>
</body>
</html>
