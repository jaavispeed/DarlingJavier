<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Recuerdos 💜</title>
    <link rel="icon" type="image/png" href="../assets/img/tuyyoGatitos.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="opacity: 0; animation: fadeInPage 1s forwards;">
    <!-- Estrellas de fondo interactivas -->
    <div class="bg-stars" id="bg-stars"></div>

    <div class="screen" id="main-screen">
        <h2>Nuestros Álbumes 💜</h2>
        <p style="text-align: center; color: var(--text-dark); margin-bottom: 40px;">Cada foto es un pedacito de nuestra magia.</p>
        
        <!-- Contenedor de Álbumes -->
        <div class="albums-container">
            
            <!-- Álbum 1: Hamburguesas -->
            <div class="polaroid" onclick="abrirAlbum('hamburguesas')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">🍔</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Hamburguesas</div>
                    <div class="p-subtitle">Nuestra comida favorita</div>
                </div>
            </div>

            <!-- Álbum 2: Comidas Varias -->
            <div class="polaroid" onclick="abrirAlbum('comidas')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">🍕</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Comidas Varias</div>
                    <div class="p-subtitle">Momentos deliciosos</div>
                </div>
            </div>

            <!-- Álbum 3: Fotos Juntos -->
            <div class="polaroid" onclick="abrirAlbum('juntos')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">💑</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Fotos Juntos</div>
                    <div class="p-subtitle">Tú y yo</div>
                </div>
            </div>

            <!-- Álbum 4: Viajes -->
            <div class="polaroid" onclick="abrirAlbum('viajes')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">✈️</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Nuestros Viajes</div>
                    <div class="p-subtitle">Aventuras por el mundo</div>
                </div>
            </div>

            <!-- Álbum 5: Otros Momentos -->
            <div class="polaroid" onclick="abrirAlbum('otros')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">✨</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Otros Momentos</div>
                    <div class="p-subtitle">Recuerdos mágicos</div>
                </div>
            </div>

            <!-- Álbum 6: Locuras -->
            <div class="polaroid" onclick="abrirAlbum('locuras')">
                <div style="width: 100%; height: 200px; background-color: var(--heart); display: flex; justify-content: center; align-items: center; border-radius: 4px;">
                    <span style="font-size: 4rem;">🤪</span>
                </div>
                <div class="polaroid-text">
                    <div class="p-title">Nuestras Locuras</div>
                    <div class="p-subtitle">Risas y más risas</div>
                </div>
            </div>
            
        </div>

        <!-- Botón para ir a la carta (Con el estilo estándar) -->
        <div style="margin-top: 20px; text-align: center; margin-bottom: 50px;">
            <button class="btn-primary" onclick="window.location.href='carta.html'">Leer mi carta especial 💌</button>
        </div>

        <!-- Slot para el reproductor en móvil -->
        <div id="inline-player"></div>
    </div>

    <!-- Modal para los Álbumes -->
    <div id="album-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;">
        <div class="modal-content" style="background: var(--light); padding: 30px; border-radius: 15px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;">
            <button onclick="cerrarAlbum()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 2rem; color: var(--primary); cursor: pointer;">&times;</button>
            <h3 id="modal-title" style="font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: var(--primary); text-align: center; margin-bottom: 20px;">Título</h3>
            <div id="modal-gallery" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%;">
                <!-- Las fotos se inyectarán aquí -->
            </div>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
    <style>
        @keyframes fadeInPage {
            to { opacity: 1; }
        }
        .modal.hidden {
            display: none !important;
        }
    </style>
</body>
</html>
